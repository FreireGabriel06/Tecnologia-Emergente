  const mat = new THREE.MeshStandardMaterial({ color: 0x2b2f36, roughness: 0.45, metalness: 0.1 });

  const botao = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.006, 16), new THREE.MeshStandardMaterial({ color: 0x9aa3b2 })); botao.position.set(lado * -0.006, 0.033, -0.01); botao.rotation.x = 0.35;
  const luz = new THREE.Mesh(new THREE.SphereGeometry(0.006, 12, 8), new THREE.MeshStandardMaterial({ color: 0x3ec5ff, emissive: 0x3ec5ff, emissiveIntensity: 2 }));

const controleE = criarControle(-1), controleD = criarControle(1);
const raio = new THREE.Mesh(new THREE.CylinderGeometry(0.002, 0.002, 1, 8), new THREE.MeshBasicMaterial({ color: 0x3ec5ff, transparent: true, opacity: 0 }));
let arco, retic;

// ---------------- carregamento ----------------
new FBXLoader().load('./sebraelab3d/Sebrae Lab.fbx', m => {

  modelo.children.forEach(f => { if (f.name.startsWith('SM_') || f.name.startsWith('chrome')) f.visible = false; });

  });

    { const o = modelo.getObjectByName(nome); if (o) objetos[nome] = new THREE.Box3().setFromObject(o); }

  const cs = sala.getCenter(new THREE.Vector3());

  lateral = new THREE.Vector3().crossVectors(v3(0, 1, 0), dirJogador).normalize();
  const yaw = Math.atan2(dirJogador.x, dirJogador.z);

    const livro = new THREE.Group();
    livro.position.copy(centroMesa).addScaledVector(lateral, (i - 1) * 0.22); livro.position.y = topoMesa + 0.016;
    livro.rotation.y = yaw + THREE.MathUtils.degToRad((i - 1) * -12);
    const capa = new THREE.Mesh(new RoundedBoxGeometry(0.16, 0.032, 0.23, 2, 0.006), new THREE.MeshStandardMaterial({ color: LIVROS[i].cor, roughness: 0.5 }));
    capa.castShadow = true; livro.add(capa);
    const paginas = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.024, 0.222), new THREE.MeshStandardMaterial({ color: 0xf1ead8, roughness: 0.9 }));
    paginas.position.x = 0.007; livro.add(paginas);
    cena.add(livro); livros.push(livro);
  }

  posLivro0 = livroAlvo.position.clone(); rotLivro0 = livroAlvo.rotation.clone();

  spot.target.position.set(centroMesa.x, topoMesa, centroMesa.z); cena.add(spot, spot.target);

  const tg = new THREE.CanvasTexture(gc); tg.wrapS = tg.wrapT = THREE.RepeatWrapping; tg.repeat.set(20, 56);
  pisoTeleporte = new THREE.Mesh(new THREE.PlaneGeometry(10, 28), new THREE.MeshBasicMaterial({ map: tg, transparent: true, opacity: 0, depthWrite: false, color: 0x3ec5ff }));

function criarPainelAzulejos() {

  }
  console.warn('painel de azulejos:', colunas ? colunas + ' colunas na parede' : 'totem');
  const largura = (colunas || 10) * LADO, grupo = new THREE.Group();
  const normal = colunas ? n : dirJogador;
  grupo.position.copy(colunas ? c.p.clone().addScaledVector(n, frente - c.p.dot(n) + 0.002)
                              : origem.clone().addScaledVector(atras, c ? Math.min(0.75, Math.max(0.45, c.d - 0.1)) : 0.75));
  grupo.lookAt(grupo.position.clone().add(normal)); // +Z do grupo virado para o jogador
  const borda = 0.04, hPlaca = 0.18, folga = 0.03, esp = 0.025, topo = alturaAz / 2 + folga + hPlaca + borda, fundo = -alturaAz / 2 - borda;
  const madeira = new THREE.Mesh(new THREE.BoxGeometry(largura + 2 * borda, topo - fundo, esp), new THREE.MeshStandardMaterial({ color: 0x3d2617, roughness: 0.7 }));
  madeira.position.set(0, (topo + fundo) / 2, esp / 2); grupo.add(madeira);
  const tex = new THREE.CanvasTexture(azulejo); tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(largura / LADO, LINHAS); tex.anisotropy = 8;
  const tiles = new THREE.Mesh(new THREE.PlaneGeometry(largura, alturaAz), new THREE.MeshStandardMaterial({ map: tex, roughness: 0.25, metalness: 0 }));
  tiles.position.z = esp + 0.002; grupo.add(tiles);
  const pcv = document.createElement('canvas'); pcv.width = Math.round(largura * 1000); pcv.height = 180; const gp = pcv.getContext('2d');
  gp.fillStyle = '#f3efe4'; gp.fillRect(0, 0, pcv.width, 180); gp.textAlign = 'center'; gp.textBaseline = 'middle';
  gp.fillStyle = '#1f3c88'; gp.font = "bold 74px 'Liberation Sans', Arial"; gp.fillText('Estante maranhense', pcv.width / 2, 62);
  gp.fillStyle = '#404c6b'; gp.font = "38px 'Liberation Sans', Arial"; gp.fillText('Autores nascidos em São Luís do Maranhão', pcv.width / 2, 138);
  const tp = new THREE.CanvasTexture(pcv); tp.colorSpace = THREE.SRGBColorSpace; tp.anisotropy = 8;
  const placa = new THREE.Mesh(new THREE.PlaneGeometry(largura, hPlaca), new THREE.MeshBasicMaterial({ map: tp, toneMapped: false }));
  placa.position.set(0, alturaAz / 2 + folga + hPlaca / 2, esp + 0.002); grupo.add(placa);
  cena.add(grupo);
}

// pontos relativos à mesa: dist = para o lado do jogador, lado = lateral
const ponto = (dist, lado, y) => centroMesa.clone().addScaledVector(dirJogador, dist).addScaledVector(lateral, lado).setY(y);

// ---------------- HUD ----------------
const el = id => document.getElementById(id);
const rotulosDiv = el('rotulos');
const rotulos = {};
function rotulo(id, texto) {
  if (!rotulos[id]) { const d = document.createElement('div'); d.className = 'rotulo'; d.innerHTML = `<div class="caixa">${texto}</div><div class="haste"></div><div class="ponto"></div>`; rotulosDiv.appendChild(d); rotulos[id] = d; }
  return rotulos[id];
}
function posicionarRotulo(d, pos, opac) {
  const p = pos.clone().project(camera);
  const vis = p.z < 1 && p.x > -1.1 && p.x < 1.1;
  d.style.left = ((p.x * 0.5 + 0.5) * L) + 'px'; d.style.top = ((-p.y * 0.5 + 0.5) * A) + 'px'; d.style.opacity = vis ? opac : 0;
}
function legendaFade(dados, t) {
  const s = dados.segmentos, D = dados.duracao;
  let atual = null; s.forEach(seg => { if (t >= seg.inicio) atual = seg; });
  const leg = el('legenda');
  if (atual && t < D - 0.3) { leg.textContent = atual.legenda; leg.style.display = 'block'; } else leg.style.display = 'none';
  let f = 0; if (t < 0.35) f = 1 - t / 0.35; else if (t > D - 0.35) f = (t - (D - 0.35)) / 0.35;
  el('fade').style.opacity = clamp(f, 0, 1);
}
function resetHUD() {
  ['titulo', 'veu', 'mira', 'teclas', 'modo', 'flash'].forEach(i => el(i).style.opacity = 0);
  Object.values(rotulos).forEach(d => d.style.opacity = 0);
  ['kw', 'ka', 'ks', 'kd', 'ke'].forEach(i => el(i).classList.remove('on'));
  controleE.visible = controleD.visible = false; raio.material.opacity = 0; arco.material.opacity = 0; retic.children[0].material.opacity = 0;
  bordas.children.forEach(b => b.material.opacity = 0); pisoTeleporte.material.opacity = 0;
  hemi.intensity = 1.85; sol.intensity = 1.05;
  spot.intensity = 0; cone.material.opacity = 0; luminaria.material.emissive.setRGB(0, 0, 0); contorno.material.opacity = 0;
  painel.material.opacity = 0; livroAlvo.position.copy(posLivro0); livroAlvo.rotation.copy(rotLivro0);
  el('tag').style.display = 'block';
}
function luzDestaque(nivel) {
  spot.intensity = 8 * nivel; cone.material.opacity = 0.05 * nivel; luminaria.material.emissive.setRGB(nivel, nivel * 0.92, nivel * 0.75);
}
function mostrarPainel(t, opac, alvoPos, livro = LIVROS[1]) {
  desenharPainel(t, livro);
  painel.material.opacity = opac;
  painel.position.copy(alvoPos).add(v3(0, 0.016 + 0.05 + 0.32, 0)); // base do Canvas 5 cm acima do livro
  const dir = v3(camera.position.x - painel.position.x, 0, camera.position.z - painel.position.z);
  painel.rotation.set(0, Math.atan2(dir.x, dir.z), 0); // sempre em pé e virado para o jogador
  painel.scale.setScalar(0.85 + 0.15 * opac);
}
function olharDe(pos, alvo) { camera.position.copy(pos); camera.lookAt(alvo); }

// ---------------- modos ----------------
const MODOS = {
  abertura(d, t) {
    el('capitulo').textContent = '';
    el('tag').style.display = 'none';
    const p = t / d.duracao;
    olharDe(caminho([v3(-7.9, 2.15, 12.5), v3(-8.9, 2.0, 8.0), v3(-10.4, 1.85, 4.2), v3(-11.6, 1.75, 2.2)], p),
            caminho([v3(-14.5, 0.8, 6.0), v3(-15.5, 0.8, 3.0), v3(-16.2, 0.9, 1.0), v3(-16.4, 1.0, 0.25)], p));
    const tt = d.segmentos[2].inicio;
    el('titulo').style.opacity = prog(t, tt - 0.2, tt + 0.8);
    el('veu').style.opacity = 0.85 * prog(t, tt - 0.4, tt + 0.8);
    luzDestaque(prog(t, 1.0, 3.0));
  },
  cenario(d, t) {
    el('capitulo').textContent = 'O cenário';
    const p = t / d.duracao;
    olharDe(caminho([v3(-7.9, 2.1, 13.0), v3(-8.2, 2.1, 8.0), v3(-8.5, 2.05, 3.8), v3(-8.6, 2.0, 2.2)], p),
            caminho([v3(-15.5, 0.6, 9.5), v3(-15.5, 0.6, 5.0), v3(-15.0, 0.5, 1.5), v3(-14.0, 0.4, 0.5)], p));
    const s1 = d.segmentos[0].inicio, s2 = d.segmentos[1].inicio;
    const itens = [['rec', 'Recepção', 'Mesa_Recepção', 0.0], ['arq', 'Arquibancada', 'Arquibancada', 0.15], ['est', 'Estações de trabalho', 'Area_de_Trabalho_1', 0.32],
                   ['sof', 'Convivência', 'Sofa', 0.48], ['mes', 'Mesas dos livros', 'Mesa_Grande', 0.6], ['coz', 'Cozinha', 'Bancada_Cozinha', 0.72]];
    for (const [id, texto, nome, atraso] of itens) {
      const b = objetos[nome]; if (!b) continue;
      const c = b.getCenter(new THREE.Vector3()); c.y = b.max.y + 0.05;
      const tIni = s1 + (s2 - s1) * atraso * 0.9;
      posicionarRotulo(rotulo(id, texto), c, prog(t, tIni, tIni + 0.5) * (1 - prog(t, s2 + 0.2, s2 + 0.8)));
    }
    const pc2 = prog(t, s2 + 0.3, s2 + 1.4);
    hemi.intensity = 1.85 * (1 - 0.65 * pc2); sol.intensity = 1.05 * (1 - 0.65 * pc2); // escurece para as colisões aparecerem
    bordas.children.forEach(b => b.material.opacity = 0.95 * pc2);
    pisoTeleporte.material.opacity = 0.55 * prog(t, s2 + 2.0, s2 + 3.0);
    const etapa = prog(t, s2 + 0.3, s2 + 1.0) * (1 - prog(t, s2 + 2.0, s2 + 2.5)), etapa2 = prog(t, s2 + 2.2, s2 + 2.9);
    posicionarRotulo(rotulo('col', 'Mesh Collider em cada peça'), v3(-12.0, 2.1, 0.5), etapa);
    posicionarRotulo(rotulo('tel', 'Chão de teleporte (Teleportation Area)'), v3(-12.6, 0.15, 2.4), etapa2);
  },
  vr(d, t) {
    el('capitulo').textContent = 'Jogabilidade em VR';
    controleE.visible = controleD.visible = true;
    const s = d.segmentos.map(x => x.inicio), D = d.duracao;
    // posição do jogador: entrada -> anda -> teleporta perto da mesa
    const pIni = ponto(5.6, -2.3, 1.6), pAnda = ponto(4.6, -1.7, 1.6), pPerto = ponto(1.05, 0.1, 1.6);
    const tTele = s[1] + (s[2] - s[1]) * 0.78; // momento do teletransporte
    let pos, alvo;
    if (t < tTele) {
      const pw = prog(t, s[1], s[1] + 2.2);
      pos = pIni.clone().lerp(pAnda, pw);
      const giro = Math.sin(prog(t, 0.2, s[1]) * Math.PI) * 0.9; // olha em volta no começo
      alvo = ponto(0, 0, 0.8).add(lateral.clone().multiplyScalar(giro * 2.2));
      alvo.lerp(ponto(0.6, 0, 0.3), prog(t, s[1] + 2.0, s[1] + 3.0)); // olha para o chão onde vai teleportar
    } else {
      pos = pPerto.clone();
      // ao pegar o livro, a cabeça sobe junto para ver o livro e o painel inteiros
      alvo = ponto(0, 0, topoMesa + 0.18).lerp(ponto(0.45, 0.1, 1.5), prog(t, s[4] + 0.2, s[4] + 1.5) * (1 - prog(t, s[5] + 0.2, s[5] + 1.1)));
    }
    pos.y += Math.sin(t * 2.1) * 0.006; // leve movimento da cabeça
    olharDe(pos, alvo);
    // controles na frente da câmera
    controleE.position.set(-0.2, -0.24, -0.42); controleE.rotation.set(0.25, 0.15, 0.1);
    controleD.position.set(0.2, -0.24, -0.42); controleD.rotation.set(0.25, -0.15, -0.1);
    // teletransporte: raio em arco do controle direito até o chão
    const pa = prog(t, s[1] + 2.4, s[1] + 2.9) * (1 - prog(t, tTele - 0.05, tTele));
    const destino = ponto(1.05, 0.1, 0.02);
    if (pa > 0) {
      const ini = controleD.getWorldPosition(new THREE.Vector3());
      const meio = ini.clone().lerp(destino, 0.5); meio.y = ini.y + 0.55;
      arco.geometry.dispose(); arco.geometry = new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(ini, meio, destino), 40, 0.006, 8, false);
    }
    arco.material.opacity = 0.9 * pa; retic.position.set(destino.x, 0.02, destino.z); retic.children[0].material.opacity = 0.9 * pa;
    retic.children[0].scale.setScalar(1 + 0.12 * Math.sin(t * 8));
    el('flash').style.opacity = Math.max(0, 1 - Math.abs(t - tTele) / 0.18);
    // luz de destaque
    luzDestaque(prog(t, s[2] + 0.4, s[2] + 1.2));
    // mão direita vai até o livro, pega, gira e solta
    const tHover = s[3] + 0.3, tPega = s[4] + 0.2, tSolta = s[5] + 0.2;
    const pm = prog(t, tHover - 0.9, tHover);
    const pg = prog(t, tPega, tPega + 1.3), ps = prog(t, tSolta, tSolta + 0.9);
    const giro = Math.max(0, t - (tPega + 1.3));
    const livroNaMao = ponto(0.45, 0.12, 1.15);
    const livroPos = posLivro0.clone().lerp(livroNaMao, pg * (1 - ps));
    livroAlvo.position.copy(livroPos);
    const k = pg * (1 - ps);
    livroAlvo.rotation.set(rotLivro0.x + (0.9 + 0.2 * Math.sin(giro * 1.4)) * k, rotLivro0.y + (0.8 + 0.6 * Math.sin(giro * 0.8)) * k, rotLivro0.z + 0.4 * k);
    if (t > tTele) {
      const mundoMao = posLivro0.clone().addScaledVector(dirJogador, 0.06).setY(topoMesa + 0.06).lerp(livroPos.clone().addScaledVector(dirJogador, 0.06), pg * (1 - ps));
      const repouso = camera.localToWorld(v3(0.2, -0.24, -0.42));
      const alvoMao = repouso.clone().lerp(mundoMao, pm * (1 - prog(t, tSolta + 0.5, tSolta + 1.4)));
      controleD.position.copy(camera.worldToLocal(alvoMao));
    }
    contorno.material.opacity = 0.85 * prog(t, tHover - 0.2, tHover) * (1 - prog(t, tSolta + 0.6, tSolta + 1.0));
    const opac = prog(t, tHover, tHover + 0.45) * (1 - prog(t, tSolta + 0.6, tSolta + 1.0));
    mostrarPainel(t, opac, livroPos);
  },
  pc(d, t) {
    el('capitulo').textContent = 'Modo PC';
    el('tag').textContent = 'Simulação do jogo · modelo 3D e lógica do projeto';
    const s = d.segmentos.map(x => x.inicio);
    const pIni = ponto(4.4, 1.3, 1.6), pFim = ponto(1.15, -0.05, 1.6);
    const pw = prog(t, 0.6, s[1] - 0.3);
    const pos = pIni.clone().lerp(pFim, pw);
    const alvo = ponto(0, 0.5, 1.0).lerp(ponto(0, 0, topoMesa + 0.05), prog(t, s[1] - 1.0, s[1]));
    olharDe(pos, alvo);
    el('mira').style.opacity = 1; el('teclas').style.opacity = prog(t, 0.2, 0.7); el('modo').style.opacity = prog(t, 0.2, 0.7);
    const andando = t > 0.6 && t < s[1] - 0.3;
    el('kw').classList.toggle('on', andando);
    el('ka').classList.toggle('on', andando && t > 1.5 && t < 2.6);
    const tE = s[1] + 1.2;
    el('ke').classList.toggle('on', t > tE && t < tE + 0.5);
    luzDestaque(prog(t, s[1] - 2.0, s[1] - 1.0));
    contorno.material.opacity = 0.85 * prog(t, s[1] - 0.4, s[1]);
    mostrarPainel(t, prog(t, tE + 0.05, tE + 0.5), posLivro0);
  },
  foto(d, t) { // imagens estáticas para os slides (sem HUD)
    const [px, py, pz] = d.camera, [ax, ay, az] = d.alvo;
    olharDe(v3(px, py, pz), v3(ax, ay, az));
    luzDestaque(d.luz ?? 1);
    if (d.painel) mostrarPainel(d.tClipe ?? 1.5, 1, posLivro0);
  },
  encerramento(d, t) {
    el('capitulo').textContent = '';
    el('tag').style.display = 'none';
    const p = t / d.duracao;
    olharDe(caminho([v3(-14.4, 1.55, 0.9), v3(-13.2, 1.75, 1.6), v3(-11.7, 2.0, 2.3)], p), v3(-16.5, 1.0, 0.2));
    luzDestaque(1);
    el('titulo').style.opacity = prog(t, d.segmentos[1].inicio - 0.6, d.segmentos[1].inicio + 0.3);
    el('veu').style.opacity = 0.85 * prog(t, d.segmentos[1].inicio - 0.8, d.segmentos[1].inicio + 0.3);
    el('titulo').querySelector('.t').textContent = 'Obrigado!';
    el('titulo').querySelector('.s').textContent = 'Sebraelab VR · Exposição Interativa de Livros em Realidade Virtual';
  },
};

window.desenhar = function (dados, t) {
  resetHUD();
  camera.fov = dados.fov || (dados.modo === 'vr' || dados.modo === 'pc' ? 70 : 55); camera.updateProjectionMatrix();
  document.body.classList.toggle('limpo', !!dados.limpo);
  document.body.classList.toggle('deck', !!dados.deck);
  MODOS[dados.modo](dados, t);
  renderer.render(cena, camera);
  legendaFade(dados, t);
};
</script>
</body>
